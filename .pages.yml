# Pages CMS setup: the browser forms SAEL uses to edit src/content (https://pagescms.org/docs).
#
# Kept in step with the Zod schemas in src/lib/schemas by tests/unit/pages-config.test.ts, so a
# rule added there has to be added here too. Editor instructions: docs/editor-guide.md.
#
# Things to know before changing this file:
# - Photo paths are relative to the content file that uses them, which is what Astro's image()
#   needs. Files directly in src/content use the "images" media source (../assets/images);
#   files one folder deeper (blog, projects) use "images-deep" (../../assets/images).
#   Both sources point at the same folder.
# - settings.content.merge must stay true: each home-page section is its own form on the same
#   file (sections.json), and merging is what keeps the other sections when one is saved.
# - A `list` written as an object must include `collapsible`, or Pages CMS rejects the config.
# - Pages CMS removes empty values when it saves. A Zod field that isn't optional must therefore
#   be `required: true` here, and an optional text field can't have `minlength` or a `pattern`
#   (both would reject the empty value).

settings:
  content:
    merge: true
  commit:
    templates:
      create: 'content: create {path} (via Pages CMS)'
      update: 'content: update {path} (via Pages CMS)'
      delete: 'content: delete {path} (via Pages CMS)'
      rename: 'content: rename {oldPath} to {newPath} (via Pages CMS)'

media:
  - name: images
    label: Photos
    input: src/assets/images
    output: ../assets/images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
  - name: images-deep
    label: Photos (blog and projects view)
    input: src/assets/images
    output: ../../assets/images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
  - name: videos
    label: Videos
    input: public/video
    output: /video
    rename: safe
    extensions: [mp4]

components:
  link:
    type: object
    required: true
    fields:
      - name: label
        label: Button or link text
        type: string
        required: true
        options: { maxlength: 40 }
      - name: href
        label: Goes to
        type: string
        required: true
        description: 'A page such as /blog, or a home-page section such as /#contact.'
        pattern:
          regex: '^(\/|#)[\w\-/#]*$'
          message: 'Use a page like /blog or a section like /#contact.'
  eyebrow:
    label: Small label above the heading
    type: string
    required: true
    options: { maxlength: 60 }
  heading:
    label: Heading
    type: string
    required: true
    description: 'Wrap words in *asterisks* to set them in the serif italic style.'
    options: { maxlength: 120 }
    pattern:
      regex: '^[^*]*(\*[^*]*\*[^*]*)*$'
      message: 'Asterisks must come in pairs, like: all *around* us.'
  paragraph:
    label: Text
    type: text
    required: true
    options: { maxlength: 600 }
  tokenText:
    type: text
    required: true
    description: 'You can write {phone}, {email}, {whatsapp}, {offices} or {blog}. They fill in from Settings, so a number is only ever typed once.'
    options: { maxlength: 600 }
    pattern:
      regex: '^(?:[^{}]|\{(?:phone|email|whatsapp|offices|blog)\})*$'
      message: 'Only {phone}, {email}, {whatsapp}, {offices} and {blog} can go in curly brackets.'
  screenReaderLabel:
    label: Label for screen readers
    type: string
    required: true
    description: "Not shown on the page. It's read aloud to people using a screen reader."
  photo:
    label: Photo
    type: image
    required: true
    options: { media: images }
  alt:
    label: Photo description
    type: string
    required: true
    description: 'Describe what the photo shows, for people who cannot see it. Required.'
    options: { minlength: 3, maxlength: 200 }
  placeholder:
    label: Still a placeholder
    type: boolean
    description: 'Keeps the "Content from SAEL" tag visible. Turn off once the real text is in.'
  stat:
    type: object
    fields:
      - name: value
        label: Figure
        type: string
        required: true
        options: { maxlength: 20 }
      - name: label
        label: What it measures
        type: string
        required: true
        options: { maxlength: 60 }
      - name: placeholder
        label: Still a placeholder
        type: boolean
        description: 'Keeps the "Figure from SAEL" tag visible. Turn off once the real figure is in.'
  systemResult:
    type: object
    required: true
    fields:
      - name: name
        label: System name
        type: string
        required: true
      - name: why
        label: Why we suggest it
        type: text
        required: true
  whatsappMessage:
    label: Prefilled WhatsApp message
    type: text
    required: true
    description: 'The message already typed for the visitor when WhatsApp opens.'
    options: { maxlength: 300 }

content:
  - name: settings
    label: Settings
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: seo
        label: Search results and link previews
        type: object
        required: true
        fields:
          - name: title
            label: Default page title
            type: string
            required: true
            options: { maxlength: 70 }
          - name: description
            label: Default description
            type: text
            required: true
            description: '50 to 170 characters. Shown under the title in Google.'
            options: { minlength: 50, maxlength: 170 }
      - name: company
        label: Company
        type: object
        required: true
        fields:
          - name: name
            label: Short name
            type: string
            required: true
          - name: legalName
            label: Legal name
            type: string
            required: true
          - name: tagline
            label: Tagline
            type: string
            required: true
          - name: summary
            label: Summary in the footer
            type: text
            required: true
            options: { maxlength: 300 }
      - name: contact
        label: Main contact details
        type: object
        required: true
        fields:
          - name: phone
            label: Phone
            type: object
            required: true
            fields:
              - name: display
                label: Number as shown on the site
                type: string
                required: true
                description: 'For example +91 98807 03083.'
                options: { minlength: 6, maxlength: 24 }
              - name: e164
                label: Number for tap-to-call
                type: string
                required: true
                description: 'No spaces, starting with the country code. For example +919880703083.'
                pattern:
                  regex: '^\+[1-9]\d{7,14}$'
                  message: 'Use international format with no spaces, like +919880703083.'
          - name: whatsapp
            label: WhatsApp number
            type: string
            required: true
            description: 'Digits only, starting with the country code, no plus sign. For example 919880703083.'
            pattern:
              regex: '^[1-9]\d{9,14}$'
              message: 'Digits only with the country code, like 919880703083.'
          - name: email
            label: Email address
            type: string
            required: true
      - name: offices
        label: Offices
        type: object
        required: true
        list:
          min: 1
          collapsible: { collapsed: true, summary: '{name}' }
        fields:
          - name: name
            label: Office name
            type: string
            required: true
            options: { maxlength: 40 }
          - name: address
            label: Address
            type: text
            options: { maxlength: 200 }
          - name: phone
            label: Phone
            type: object
            fields:
              - name: display
                label: Number as shown on the site
                type: string
                required: true
                options: { minlength: 6, maxlength: 24 }
              - name: e164
                label: Number for tap-to-call
                type: string
                required: true
                description: 'No spaces, starting with the country code.'
                pattern:
                  regex: '^\+[1-9]\d{7,14}$'
                  message: 'Use international format with no spaces, like +919880703083.'
          - name: email
            label: Email address
            type: string
          - name: street
            label: 'For Google: street'
            type: string
            description: 'The address again, split up for search results. Fill in all five of these or leave them all empty; an office without them is not listed.'
            options: { maxlength: 120 }
          - name: city
            label: 'For Google: town or city'
            type: string
            options: { maxlength: 60 }
          - name: state
            label: 'For Google: state'
            type: string
            options: { maxlength: 60 }
          - name: postalCode
            label: 'For Google: PIN or postcode'
            type: string
            options: { maxlength: 12 }
          - name: country
            label: 'For Google: country code'
            type: string
            description: 'Two capital letters, such as IN.'
            options: { maxlength: 2 }
      - name: primaryCta
        label: Main button (top bar and mobile bar)
        component: link
      - name: nav
        label: Menus
        type: object
        required: true
        fields:
          - name: header
            label: Top bar links
            component: link
            list: { min: 1, max: 7, collapsible: { collapsed: true, summary: '{label}' } }
          - name: menu
            label: Full menu links
            component: link
            list: { min: 1, max: 10, collapsible: { collapsed: true, summary: '{label}' } }
      - name: footer
        label: Footer
        type: object
        required: true
        fields:
          - name: columns
            label: Link columns
            type: object
            list: { max: 3, collapsible: { collapsed: true, summary: '{title}' } }
            fields:
              - name: title
                label: Column title
                type: string
                required: true
                options: { maxlength: 30 }
              - name: links
                label: Links
                component: link
                list: { min: 1, collapsible: { collapsed: true, summary: '{label}' } }
          - name: credits
            label: Photo and source credits
            type: text
            options: { maxlength: 600 }

  - name: home
    label: Home page
    type: group
    items:
      - name: section-hero
        label: Hero
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: hero
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: headline
                label: Big headline
                type: string
                required: true
                description: 'One line per entry. Wrap words in *asterisks* for the serif italic style.'
                list: { min: 1, max: 3, collapsible: false }
                options: { maxlength: 40 }
                pattern:
                  regex: '^[^*]*(\*[^*]*\*[^*]*)*$'
                  message: 'Asterisks must come in pairs, like: all *around* us.'
              - name: intro
                label: Intro text
                component: paragraph
              - name: primaryCta
                label: First button
                component: link
              - name: secondaryCta
                label: Second button
                component: link
              - name: fact
                label: Fact beside the headline
                type: object
                required: true
                fields:
                  - name: value
                    label: Figure
                    type: string
                    required: true
                    options: { maxlength: 20 }
                  - name: label
                    label: What it measures
                    type: string
                    required: true
                    options: { maxlength: 60 }
              - name: slidesLabel
                component: screenReaderLabel
                options: { maxlength: 60 }
              - name: slides
                label: Slides
                type: object
                required: true
                description: 'The first photo loads first, so keep your strongest image at the top.'
                list: { min: 1, max: 6, collapsible: { collapsed: true, summary: '{title}' } }
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
                  - name: tag
                    label: Small tag
                    type: string
                    required: true
                    options: { maxlength: 40 }
                  - name: title
                    label: Caption
                    type: string
                    required: true
                    options: { maxlength: 60 }
                  - name: credit
                    label: Photo credit
                    type: string
                    required: true
                    options: { maxlength: 60 }

      - name: section-highlights
        label: Highlights
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: highlights
            label: false
            type: object
            required: true
            fields:
              - name: label
                component: screenReaderLabel
              - name: items
                label: Highlights
                type: object
                required: true
                list: { min: 1, max: 4, collapsible: { collapsed: true, summary: '{title}' } }
                fields:
                  - name: icon
                    label: Icon
                    type: select
                    required: true
                    options:
                      values:
                        - { value: home, label: House }
                        - { value: rupee, label: Rupee }
                        - { value: wrench, label: Wrench }
                        - { value: clock, label: Clock }
                  - name: title
                    label: Title
                    type: string
                    required: true
                    options: { maxlength: 40 }
                  - name: text
                    label: Text
                    type: string
                    required: true
                    options: { maxlength: 60 }

      - name: section-systems
        label: Compare systems and finder
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: systems
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: table
                label: Comparison table
                type: object
                required: true
                fields:
                  - name: label
                    component: screenReaderLabel
                  - name: columns
                    label: Column headings
                    type: object
                    required: true
                    fields:
                      - { name: onGrid, label: On-grid, type: string, required: true }
                      - { name: offGrid, label: Off-grid, type: string, required: true }
                      - { name: hybrid, label: Hybrid, type: string, required: true }
                  - name: rows
                    label: Rows
                    type: object
                    required: true
                    list: { min: 1, collapsible: { collapsed: true, summary: '{label}' } }
                    fields:
                      - name: label
                        label: Row name
                        type: string
                        required: true
                        options: { maxlength: 40 }
                      - name: onGrid
                        label: On-grid
                        type: string
                        required: true
                        description: 'Use — when it does not apply.'
                        options: { maxlength: 40 }
                      - name: offGrid
                        label: Off-grid
                        type: string
                        required: true
                        description: 'Use — when it does not apply.'
                        options: { maxlength: 40 }
                      - name: hybrid
                        label: Hybrid
                        type: string
                        required: true
                        description: 'Use — when it does not apply.'
                        options: { maxlength: 40 }
                      - name: tick
                        label: Show ticks
                        type: boolean
                        description: 'Shows a tick before every value that is not —.'
              - name: finder
                label: System finder
                type: object
                required: true
                fields:
                  - name: label
                    component: screenReaderLabel
                  - {
                      name: gridQuestion,
                      label: Question about the grid,
                      type: string,
                      required: true,
                    }
                  - {
                      name: cutsQuestion,
                      label: Question about power cuts,
                      type: string,
                      required: true,
                    }
                  - { name: 'yes', label: '"Yes" answer', type: string, required: true }
                  - { name: 'no', label: '"No" answer', type: string, required: true }
                  - { name: rarely, label: '"Rarely" answer', type: string, required: true }
                  - { name: often, label: '"Often" answer', type: string, required: true }
                  - {
                      name: resultLabel,
                      label: Label above the result,
                      type: string,
                      required: true,
                    }
                  - name: results
                    label: Results
                    type: object
                    required: true
                    fields:
                      - { name: onGrid, label: On-grid result, component: systemResult }
                      - { name: hybrid, label: Hybrid result, component: systemResult }
                      - { name: offGrid, label: Off-grid result, component: systemResult }
                  - name: more
                    label: Note with a link
                    type: object
                    required: true
                    fields:
                      - { name: text, label: Text, type: string, required: true }
                      - { name: link, label: Link, component: link }
                  - name: cta
                    label: Button
                    component: link

      - name: section-subsidy
        label: Subsidy section text
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: subsidy
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: intro
                label: Intro text
                component: paragraph
              - name: handles
                label: Short points
                type: string
                required: true
                description: 'The rates themselves are under "Subsidy rates".'
                list: { max: 6, collapsible: false }
                options: { maxlength: 60 }
              - name: calculator
                label: Calculator
                type: object
                required: true
                fields:
                  - name: label
                    component: screenReaderLabel
                  - { name: sizeLabel, label: System size label, type: string, required: true }
                  - { name: stateLabel, label: State label, type: string, required: true }
                  - name: stateTopUpLabel
                    label: Top-up label for "Other states"
                    type: string
                    required: true
                  - name: namedStateTopUpLabel
                    label: Top-up label for a named state
                    type: string
                    required: true
                    description: 'Keep {state}: it becomes the state name.'
                    pattern:
                      regex: '\{state\}'
                      message: 'Keep {state} in the text.'
                  - {
                      name: centralTotalLabel,
                      label: Central subsidy label,
                      type: string,
                      required: true,
                    }
                  - {
                      name: combinedTotalLabel,
                      label: Combined total label,
                      type: string,
                      required: true,
                    }
                  - name: note
                    label: Note under the result
                    type: text
                    required: true
                    options: { maxlength: 240 }
                  - name: cta
                    label: Button
                    component: link

      - name: section-process
        label: How it works
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: process
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: steps
                label: Steps
                type: object
                required: true
                list: { min: 2, max: 8, collapsible: { collapsed: true, summary: '{title}' } }
                fields:
                  - name: title
                    label: Title
                    type: string
                    required: true
                    options: { maxlength: 40 }
                  - name: text
                    label: Text
                    type: text
                    required: true
                    options: { maxlength: 200 }
              - name: tracker
                label: Progress tracker
                type: object
                required: true
                fields:
                  - name: label
                    component: screenReaderLabel
                  - name: stages
                    label: Stages
                    type: string
                    required: true
                    list: { min: 2, max: 8, collapsible: false }
                    options: { maxlength: 40 }

      - name: section-why
        label: Why SAEL
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: why
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: feature
                label: Large photo tile
                type: object
                required: true
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
                  - name: credit
                    label: Photo credit
                    type: string
                    required: true
                    options: { maxlength: 60 }
                  - name: title
                    label: Title
                    type: string
                    required: true
                    options: { maxlength: 120 }
              - name: tiles
                label: Text tiles
                type: object
                list: { max: 4, collapsible: { collapsed: true, summary: '{title}' } }
                fields:
                  - name: title
                    label: Title
                    type: string
                    required: true
                    options: { maxlength: 60 }
                  - name: text
                    label: Text
                    type: text
                    required: true
                    options: { maxlength: 200 }
                  - name: placeholder
                    component: placeholder

      - name: section-engineering
        label: Engineering
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: engineering
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: body
                component: paragraph
              - name: photo
                label: Main photo
                type: object
                required: true
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
              - name: stats
                label: Figures
                component: stat
                list: { max: 3, collapsible: { collapsed: true, summary: '{label}' } }
              - name: stripLabel
                component: screenReaderLabel
              - name: strip
                label: Moving photo strip
                type: object
                required: true
                list: { min: 2, max: 12, collapsible: { collapsed: true, summary: '{alt}' } }
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt

      - name: section-gallery
        label: Gallery
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: gallery
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: items
                label: Photos
                type: object
                required: true
                list: { min: 1, collapsible: { collapsed: true, summary: '{title}' } }
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
                  - name: title
                    label: Title
                    type: string
                    required: true
                    options: { maxlength: 40 }
                  - name: place
                    label: Place
                    type: string
                    required: true
                    options: { maxlength: 60 }
              - name: controls
                label: Button and viewer labels
                type: object
                required: true
                description: 'Mostly read aloud by screen readers.'
                fields:
                  - {
                      name: previous,
                      label: Previous button,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - {
                      name: next,
                      label: Next button,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - {
                      name: open,
                      label: Open photo,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - {
                      name: viewer,
                      label: Photo viewer,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - {
                      name: close,
                      label: Close viewer,
                      type: string,
                      required: true,
                      options: { maxlength: 20 },
                    }
                  - {
                      name: previousPhoto,
                      label: Previous photo,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - {
                      name: nextPhoto,
                      label: Next photo,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - name: credit
                    label: Text before the place in the caption
                    type: string
                    required: true
                    options: { maxlength: 40 }

      - name: section-numbers
        label: Numbers band
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: numbers
            label: false
            type: object
            required: true
            fields:
              - name: label
                component: screenReaderLabel
              - name: stats
                label: Figures
                component: stat
                required: true
                list: { min: 1, max: 4, collapsible: { collapsed: true, summary: '{label}' } }
              - name: ticker
                label: Moving text
                type: string
                required: true
                list: { min: 1, collapsible: false }
                options: { maxlength: 30 }

      - name: section-projects
        label: Projects section text
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: projects
            label: false
            type: object
            required: true
            description: 'The projects themselves are under "Projects".'
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading

      - name: section-audience
        label: Who it's for
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: audience
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: label
                component: screenReaderLabel
              - name: tabs
                label: Tabs
                type: object
                required: true
                list: { min: 2, max: 6, collapsible: { collapsed: true, summary: '{label}' } }
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
                  - name: label
                    label: Tab name
                    type: string
                    required: true
                    options: { maxlength: 30 }
                  - name: text
                    label: Text
                    type: text
                    required: true
                    options: { maxlength: 240 }

      - name: section-faq
        label: FAQs section text
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: faq
            label: false
            type: object
            required: true
            description: 'The questions themselves are under "FAQs".'
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: intro
                label: Intro text
                component: tokenText
                options: { maxlength: 240 }

      - name: section-contact
        label: Contact form
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: contact
            label: false
            type: object
            required: true
