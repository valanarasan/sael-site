                    options: { maxlength: 200 }
                  - name: relatedHeading
                    label: Related articles heading
                    component: heading
                  - {
                      name: whatsappLabel,
                      label: WhatsApp button,
                      type: string,
                      required: true,
                      options: { maxlength: 40 },
                    }
                  - name: whatsappMessage
                    component: whatsappMessage
                    description: 'The message already typed for the visitor. {title} becomes the article title.'
      - name: section-not-found
        label: Page not found text
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: notFound
            label: false
            type: object
            required: true
            fields:
              - {
                  name: title,
                  label: Title,
                  type: string,
                  required: true,
                  options: { maxlength: 80 },
                }
              - name: text
                label: Text
                component: tokenText
                options: { maxlength: 400 }
              - {
                  name: backLabel,
                  label: Back button,
                  type: string,
                  required: true,
                  options: { maxlength: 40 },
                }

  - name: blog
    label: Blog articles
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    view:
      fields: [title, topic, draft, publishDate]
      primary: title
      sort: [publishDate, title]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options: { minlength: 5, maxlength: 110 }
      - name: draft
        label: Draft (not published yet)
        type: boolean
        default: true
        description: 'Drafts show as "Article coming soon" cards. To publish, turn this off and fill in the summary and publish date.'
      - name: description
        label: Summary
        type: text
        description: '50 to 170 characters. Needed to publish. Shown under the title and in Google.'
        options: { maxlength: 170 }
      - name: topic
        label: Topic
        type: select
        required: true
        options:
          values:
            - Subsidy & schemes
            - Solar basics
            - Monsoon
            - Performance
            - O&M & AMC
      - name: order
        label: Position among coming-soon cards
        type: number
        description: 'Optional. 1 comes first within a topic. Published articles sort by date instead.'
        options: { min: 1, max: 99 }
      - name: cover
        label: Cover photo
        type: image
        required: true
        options: { media: images-deep }
      - name: coverAlt
        component: alt
      - name: publishDate
        label: Publish date
        type: date
        default: ''
        description: 'Needed to publish.'
        options: { format: yyyy-MM-dd }
      - name: updatedDate
        label: Last updated
        type: date
        default: ''
        description: 'Optional. Only when an article has changed meaningfully.'
        options: { format: yyyy-MM-dd }
      - name: author
        label: Author
        type: string
        description: 'Optional. Leave empty to credit SAEL Energy.'
        options: { maxlength: 60 }
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          media: images-deep

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: json
    filename:
      template: '{primary}.json'
      field: create
    view:
      fields: [title, layout, order, draft]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project name
        type: string
        required: true
        description: 'South India projects only.'
        options: { maxlength: 80 }
      - name: layout
        label: Size of the card
        type: select
        required: true
        options:
          values:
            - { value: feature, label: Large featured card }
            - { value: card, label: Card with a photo }
            - { value: mini, label: One-line figure }
      - name: size
        label: Plant size
        type: string
        description: 'For example 4.5 MW. Leave empty if it is not public.'
        options: { maxlength: 20 }
      - name: kind
        label: Type of work
        type: string
        required: true
        description: 'For example solar, or Rooftop & ground-mount.'
        options: { maxlength: 60 }
      - name: location
        label: Location
        type: string
        options: { maxlength: 80 }
      - name: year
        label: Year
        type: number
        options: { min: 2000, max: 2100 }
      - name: summary
        label: Summary
        type: text
        options: { maxlength: 240 }
      - name: image
        label: Photo
        type: image
        options: { media: images-deep }
      - name: alt
        label: Photo description
        type: string
        description: 'Needed when there is a photo. Describe what it shows.'
        options: { maxlength: 200 }
      - name: credit
        label: Photo credit
        type: string
        options: { maxlength: 80 }
      - name: order
        label: Position
        type: number
        description: 'Lower numbers come first.'
      - name: draft
        label: Hide from the site
        type: boolean

  - name: faqs
    label: FAQs
    type: file
    path: src/content/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
        options: { minlength: 5, maxlength: 160 }
      - name: answer
        label: Answer
        type: text
        required: true
        options: { minlength: 10, maxlength: 1200 }

  - name: subsidy
    label: Subsidy rates
    type: file
    path: src/content/subsidy.json
    format: json
    fields:
      - name: central
        label: Central subsidy
        type: object
        required: true
        fields:
          - name: name
            label: Scheme name
            type: string
            required: true
          - name: slabs
            label: Slabs
            type: object
            required: true
            description: 'Each slab must start where the one before it ends.'
            list:
              { min: 1, collapsible: { collapsed: true, summary: 'From {fromKw} to {toKw} kW' } }
            fields:
              - name: fromKw
                label: From (kW)
                type: number
                required: true
                options: { min: 0 }
              - name: toKw
                label: Up to (kW)
                type: number
                required: true
                options: { min: 0 }
              - name: perKw
                label: Rupees per kW
                type: number
                required: true
                options: { min: 0, max: 10000000 }
          - name: cap
            label: Maximum central subsidy (rupees)
            type: number
            required: true
            options: { min: 0, max: 10000000 }
      - name: defaultStateId
        label: State selected at first
        type: string
        required: true
        description: 'The two-letter code of a state in the list below.'
        pattern:
          regex: '^[A-Z]{2}$'
          message: 'Two capital letters, like KA.'
      - name: fallbackStateId
        label: State code for "Other states"
        type: string
        required: true
        description: 'The two-letter code of the "Other states" entry below.'
        pattern:
          regex: '^[A-Z]{2}$'
          message: 'Two capital letters, like XX.'
      - name: states
        label: States
        type: object
        required: true
        description: 'To add a state, add an entry. Leave the rupee fields empty for a state that only needs a note.'
        list: { min: 1, collapsible: { collapsed: true, summary: '{name}' } }
        fields:
          - name: id
            label: Two-letter code
            type: string
            required: true
            pattern:
              regex: '^[A-Z]{2}$'
              message: 'Two capital letters, like KA.'
          - name: name
            label: State name
            type: string
            required: true
            options: { maxlength: 40 }
          - name: perKw
            label: Top-up in rupees per kW
            type: number
            options: { min: 0, max: 10000000 }
          - name: capKw
            label: Top-up stops at this many kW
            type: number
            description: 'Only with a top-up per kW.'
            options: { min: 0 }
          - name: cap
            label: Maximum top-up (rupees)
            type: number
            description: 'Only with a top-up per kW.'
            options: { min: 0, max: 10000000 }
          - name: note
            label: Note under the result
            type: text
            options: { maxlength: 240 }

  - name: chat
    label: Chat assistant
    type: file
    path: src/content/chat.json
    format: json
    fields:
      - name: intents
        label: Answers
        type: object
        required: true
        description: 'To add an answer, add an entry. No code changes are needed.'
        list: { min: 1, collapsible: { collapsed: true, summary: '{id}' } }
        fields:
          - name: id
            label: Short name
            type: string
            required: true
            description: 'Lower-case letters, numbers and hyphens. Must be different from the others.'
            pattern:
              regex: '^[a-z][a-z0-9-]*$'
              message: 'Lower-case letters, numbers and hyphens.'
          - name: keywords
            label: Words that trigger this answer
            type: string
            required: true
            list: { min: 1, collapsible: false }
            options: { minlength: 2, maxlength: 40 }
          - name: answer
            label: Answer
            component: tokenText
          - name: links
            label: Links under the answer
            component: link
            required: false
            list: { max: 3, collapsible: { collapsed: true, summary: '{label}' } }
          - name: related
            label: Blog articles to suggest
            type: reference
            options:
              collection: blog
              multiple: true
              max: 3
              search: title
              value: '{name}'
              label: '{title}'
          - name: whatsapp
            label: Prefilled WhatsApp message
            type: text
            description: 'Optional. Leave empty for no WhatsApp button.'
            options: { maxlength: 300 }
      - name: chips
        label: Suggested questions
        type: object
        required: true
        list: { min: 1, max: 10, collapsible: { collapsed: true, summary: '{label}' } }
        fields:
          - name: label
            label: Button text
            type: string
            required: true
            options: { maxlength: 30 }
          - name: message
            label: Question it asks
            type: string
            description: 'Leave empty to make this button open WhatsApp instead.'
            options: { maxlength: 120 }
      - name: greeting
        label: Greeting
        component: tokenText
        options: { maxlength: 400 }
      - name: fallback
        label: When no answer matches
        type: object
        required: true
        fields:
          - name: answer
            label: Reply
            component: tokenText
            options: { maxlength: 300 }
          - name: whatsapp
            component: whatsappMessage
      - name: whatsappChip
        label: Reply for the WhatsApp button
        type: object
        required: true
        fields:
          - name: answer
            label: Reply
            type: text
            required: true
            options: { maxlength: 200 }
          - name: whatsapp
            component: whatsappMessage
          - name: buttonLabel
            label: Button text
            type: string
            required: true
            options: { maxlength: 30 }
      - name: subsidyFollowUp
        label: Subsidy size follow-up
        type: object
        required: true
        description: '{kw} and {amount} are filled in by the chat.'
        fields:
          - name: intentId
            label: Answer this follows
            type: string
            required: true
            readonly: true
          - name: answer
            label: Reply
            type: text
            required: true
            description: 'Keep {amount}: it becomes the subsidy figure.'
            pattern:
              regex: '\{amount\}'
              message: 'Keep {amount} in the text.'
          - name: capNote
            label: Note when the size is above the cap
            type: text
            required: true
            options: { maxlength: 200 }
          - name: confirm
            label: Closing line
            type: text
            required: true
            options: { maxlength: 200 }
          - name: whatsapp
            component: whatsappMessage
          - name: buttonLabel
            label: Button text
            type: string
            required: true
            options: { maxlength: 30 }
      - name: title
        label: Panel title
        type: string
        required: true
        options: { maxlength: 40 }
      - name: subtitle
        label: Panel subtitle
        type: string
        required: true
        options: { maxlength: 60 }
      - name: openLabel
        label: Button that opens the chat
        type: string
        required: true
        options: { maxlength: 30 }
      - name: inputLabel
        label: Label for the question box
        type: string
        required: true
        options: { maxlength: 40 }
      - name: inputPlaceholder
        label: Hint inside the question box
        type: string
        required: true
        options: { maxlength: 40 }
      - name: note
        label: Small note under the chat
        type: text
        required: true
        options: { maxlength: 200 }
      - name: whatsappLabel
        label: WhatsApp button
        type: string
        required: true
        options: { maxlength: 40 }
      - name: closeLabel
        label: Close button
        type: string
        required: true
        options: { maxlength: 30 }
      - name: sendLabel
        label: Send button
        type: string
        required: true
        options: { maxlength: 20 }
      - name: chipsLabel
        component: screenReaderLabel
        options: { maxlength: 40 }
      - name: readLabel
        label: Text before article links
        type: string
        required: true
        description: 'For example "Read:".'
        options: { maxlength: 20 }
