              - name: heading
                component: heading
              - name: intro
                label: Intro text
                component: paragraph
              - name: filterLabel
                component: screenReaderLabel
              - { name: allLabel, label: '"All" filter button', type: string, required: true }
              - { name: comingSoon, label: Text on unpublished cards, type: string, required: true }
