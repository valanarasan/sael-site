      - name: section-blog
        label: Blog page text
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: blog
            label: false
            type: object
            required: true
            fields:
              - name: seoTitle
                label: Browser tab and search title
                type: string
                required: true
                options: { maxlength: 60 }
              - name: seoDescription
                label: Search description
                type: text
                required: true
                description: '50 to 170 characters.'
                options: { minlength: 50, maxlength: 170 }
              - name: feedTitle
                label: RSS feed title
                type: string
                required: true
