                  - {
                      name: byLabel,
                      label: '"By" label',
                      type: string,
                      required: true,
                      options: { maxlength: 20 },
                    }
                  - {
                      name: publishedLabel,
                      label: '"Published" label',
                      type: string,
                      required: true,
                      options: { maxlength: 30 },
                    }
                  - {
                      name: updatedLabel,
                      label: '"Updated" label',
                      type: string,
                      required: true,
                      options: { maxlength: 30 },
                    }
                  - name: draftNotice
                    label: Notice on draft previews
                    type: text
