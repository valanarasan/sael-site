          - name: dayNight
            label: false
            type: object
            required: true
            fields:
              - name: eyebrow
                component: eyebrow
              - name: heading
                component: heading
              - name: text
                component: paragraph
              - name: sliderLabel
                component: screenReaderLabel
              - name: day
                label: Day side
                type: object
                required: true
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
                  - { name: tag, label: Small tag, type: string, required: true }
                  - { name: text, label: Text, type: string, required: true }
              - name: night
                label: Night side
                type: object
                required: true
                fields:
                  - name: image
                    component: photo
                  - name: alt
                    component: alt
                  - { name: tag, label: Small tag, type: string, required: true }
                  - { name: text, label: Text, type: string, required: true }
              - name: credit
                label: Photo credit
                type: string
                required: true
                options: { maxlength: 120 }

      - name: section-progress
        label: Section names (progress pill)
        type: file
        path: src/content/sections.json
        format: json
        fields:
          - name: progress
